services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://tracker:tracker@db:5432/tracker?sslmode=disable
      HASH_SECRET: dev-secret-change-me
      API_TOKEN: dev-token-change-me-please
      LOG_LEVEL: debug
      ALLOW_LOCALHOST: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
